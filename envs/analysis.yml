name: analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11 #=3.9

  # General Packages
  - setuptools<71
  - jupyter
  - numpy<2.0.0 #=1.23
  - pandas #=1.2.2
  - regex
  - tqdm
  - pip

  # Neuroimaging Packages
  - nibabel
  - nilearn

  # Plotting Packages
  - matplotlib
  - seaborn #=0.13.0
  - joypy

  # SurfPlot Packages
  - vtk>9.4

  # Machine Learning Packages
  - scipy
  - scikit-learn
  - pytorch
  - torchaudio
  - torchvision
  - einops

  # NLP Packages
  - nltk
  - spacy
  - gensim
  - huggingface_hub
  - transformers>=4.51.0,<5.0.0
  - praatio # For TextGrids

  # Misc
  - moviepy
  - statsmodels

  - pip:
    - scikit-image
    - pymoten
    - scenedetect # Scene Cuts
    - infomeasure # Information theory + entropy 
    
    # General Packages
    - natsort
    - sentencepiece
    - transformers_stream_generator
    - fasttext-wheel

    # PyTorch Packages
    - torchcodec
    - torchlens
    - open_clip_torch

    # Machine Learning Packages
    - himalaya
    - nimfa
    - slicetca

    # Audio Packages
    - av
    - pydub
    - librosa

    # Neuroimaging Packages
    - neuromaps
    - pliers
    - clarifai

    # Misc Packagesconda
    - mergedeep
    - opencv-python

    # Tommy's Packages
    - git+https://github.com/thefinnlab/tommy_utils.git@main