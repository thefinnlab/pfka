_target_: src.data.audio_text_datamodule.AudioTextDataModule
dataset_name: None
data_dir: ${paths.data_dir}/

batch_size: 32
text_model_name: gpt2
audio_model_name: wav2vec2
video_model_name: data2vec
token_fusion_method: null
token_fusion_weights: null
preload: False
ckpt_path: null

# Control condition: shuffle each token's context embedding dims independently at load time.
# When shuffle_context_dims=True, context_type determines which feature to shuffle.
# If context_type='prominence', prominence is also projected 1D→context_embed_dim first.
shuffle_context_dims: False
context_type: ${model.config.context_type}
context_embed_dim: ${model.config.embed_dim}

subset_percentage: null

num_workers: 0
pin_memory: False